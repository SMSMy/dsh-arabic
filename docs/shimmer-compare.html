<!doctype html>
<!--
  shimmer-compare.html — proof that the mirrored pair sweeps the other way.

  The app's activity light is two layers that must stay in step:
    .sweep      a moving mask over tinted glyphs      translateX(-100%) -> (100%)
    .highlight  a counter-moving block under the mask (100%) -> (-100%)
  Each cell below freezes those layers at a chosen moment of the cycle with a
  negative animation-delay and animation-play-state: paused, so the position of
  the light is comparable between the English layout and the Arabic override.
  A tinted bar travels through a grey word; mirroring means the bar is at the
  mirrored position at the same instant.

  Both cells carry the class names the shipped frontend actually renders — the
  build hashes every CSS module class, so the DOM holds `_sweep_1rdzk_34`, not
  `.sweep`. An earlier version of this page used the source names and therefore
  proved nothing about production; the names are pinned in data/shimmer-pins.json
  and re-checked by scripts/check-shimmer-pins.mjs.

  Render: chrome --headless=new --screenshot=docs/shimmer-compare.png --window-size=760,190 <file-url>
-->
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 16px 20px; background: #12161f; color: #e8ecf5;
         font: 15px/1.6 "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 13.5px; margin: 0 0 12px; color: #9fb0d9; font-weight: 600; }
  .row { display: flex; gap: 16px; align-items: center; margin-bottom: 10px; }
  .tag { width: 92px; color: #7f8aa3; font-size: 12.5px; }
  .frame { position: relative; width: 320px; height: 40px; border-radius: 6px;
           background: #1b2130; color: #39415c; display: flex; align-items: center;
           padding: 0 12px; font-weight: 600; }

  /* the app's own sheet, verbatim from the shipped build (hashed class names) */
  ._root_1rdzk_1 { position: relative; display: inline-grid; width: max-content; min-width: 0; }
  ._content_1rdzk_11 { display: flex; align-items: center; min-width: 0; }
  ._text_1rdzk_17 { color: inherit; }
  ._text_1rdzk_17[data-shimmer-text]::after { content: attr(data-shimmer-text); }
  ._decoration_1rdzk_25 { position: absolute; inset: 0; overflow: clip; pointer-events: none; user-select: none; }
  ._sweep_1rdzk_34 { position: absolute; inset: 0; overflow: hidden; color: #a9c9ff;
                     mask-image: linear-gradient(105deg, transparent 0%, black 40% 60%, transparent 100%);
                     transform: translateX(-100%); animation-name: _dsh-row-shimmer-sweep_1rdzk_1; }
  ._sweep_1rdzk_34 * { color: inherit !important; }
  ._highlight_1rdzk_54 { width: 100%; height: 100%; transform: translateX(100%);
                         animation-name: _dsh-row-shimmer-highlight_1rdzk_1; }
  ._sweep_1rdzk_34, ._highlight_1rdzk_54 { animation-duration: 1.5s; animation-delay: -0.45s;
                                           animation-timing-function: steps(48, end);
                                           animation-iteration-count: infinite; animation-play-state: paused; }
  @keyframes _dsh-row-shimmer-sweep_1rdzk_1 { 0% { transform: translateX(-100%); } 66.6667%, 100% { transform: translateX(100%); } }
  @keyframes _dsh-row-shimmer-highlight_1rdzk_1 { 0% { transform: translateX(100%); } 66.6667%, 100% { transform: translateX(-100%); } }

  /* dsh-arabic for Arabic — the same selector shape index.js ships */
  .ar [class*="_sweep_"] { animation-name: dsh-arabic-shimmer-sweep; transform: translateX(100%);
                           mask-image: linear-gradient(75deg, transparent 0%, black 40% 60%, transparent 100%); }
  .ar [class*="_highlight_"] { animation-name: dsh-arabic-shimmer-highlight; transform: translateX(-100%); }
  @keyframes dsh-arabic-shimmer-sweep { 0% { transform: translateX(100%); } 66.6667%, 100% { transform: translateX(-100%); } }
  @keyframes dsh-arabic-shimmer-highlight { 0% { transform: translateX(-100%); } 66.6667%, 100% { transform: translateX(100%); } }
</style>
<h1>نفس اللحظة (‎-0.45s‎) من الدورة: الإنجليزية مقابل العربية — الشريط يجب أن يكون في الموضع المعكوس</h1>
