name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor the plugin claims, 22 is the current LTS line, and 24 is
        # what the release workflow publishes with — testing it here means a
        # release cannot be the first place a Node 24 difference shows up.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install exact dependencies
        run: npm ci

      - name: Validate the Arabic catalog against the official key set
        run: node scripts/build-client.mjs --check

      - name: Rebuild the browser half and confirm it is current
        run: |
          node scripts/build-client.mjs
          git diff --exit-code lib/client.js

      - name: Cross-batch consistency lint
        run: node scripts/lint-consistency.mjs --strict

      - name: Documentation counts match the suites
        run: node scripts/check-docs.mjs

      - name: Live-status family decisions are on record
        run: node scripts/check-bidi-family.mjs

      - name: Locale pack contract + registration tests
        run: node tests/verify-locales.mjs

      - name: Bidi/RTL behaviour tests
        run: node tests/verify-rtl.mjs

      - name: Golden direction matrix
        run: node tests/golden-direction.mjs

      # The shim suite decides; this one lays the same decisions out in a real
      # bidi engine and reads the glyph order back. It skips (exit 0) when the
      # runner has no Chrome, so the gate never fails for want of a browser.
      - name: Direction decisions as a browser lays them out
        run: node tests/browser-bidi.mjs

      - name: Direction-layer cost against the recorded baseline
        run: node scripts/check-bench.mjs

      - name: Coverage against the recorded upstream revision
        run: node scripts/status.mjs
